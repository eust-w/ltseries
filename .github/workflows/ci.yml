name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27019:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/server

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LeriesStudio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: LeriesStudio/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated smoke-test configuration
        run: |
          cp .env.example .env
          sed -i 's/^AUTH_ENABLED=.*/AUTH_ENABLED=false/' .env
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180
      - name: Check API, frontend proxy and FFmpeg
        run: |
          curl --retry 15 --retry-delay 2 --retry-connrefused --fail http://localhost:3108/
          curl --fail http://localhost:18080/api/health
          curl --fail http://localhost:3108/api/health
          docker compose exec -T backend ffmpeg -version
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
